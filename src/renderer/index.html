<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 오프라인 앱: 외부 스크립트·스타일·이미지·네트워크를 허용하지 않는다. 예외는 유튜브 임베드 플레이어 화면(frame-src)뿐이며, 설정에서 켠 경우에만 쓰인다. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vslim-media:; media-src vslim-media:; frame-src https://www.youtube-nocookie.com; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VideoSlim Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
